name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BINARY_NAME: haruki-sekai-asset-updater

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Scoped here rather than at workflow level: `publish` needs `contents:
    # write` and overrides it anyway, so a workflow-wide grant only widens what
    # this job gets. Building artifacts needs no more than a checkout.
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - os: macos-latest
            name: macos-arm64
            archive: tar.gz
          - os: windows-2025
            name: windows-x64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Apply tag package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY' "${version}"
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          manifest = Path("Cargo.toml")
          text = manifest.read_text()
          text = re.sub(r'(?m)^(version = )"[^"]+"', rf'\1"{version}"', text, count=1)
          manifest.write_text(text)
          PY
          cargo generate-lockfile

      - name: Build release binaries
        run: cargo build --release --locked -p haruki-sekai-asset-updater

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          package_dir="${{ env.BINARY_NAME }}-${{ matrix.name }}"
          mkdir -p "dist/${package_dir}"
          cp "target/release/${{ env.BINARY_NAME }}" "dist/${package_dir}/${{ env.BINARY_NAME }}"
          tar -czf "dist/${package_dir}.tar.gz" -C dist "${package_dir}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $packageDir = "${{ env.BINARY_NAME }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$packageDir" | Out-Null
          Copy-Item "target/release/${{ env.BINARY_NAME }}.exe" "dist/$packageDir/${{ env.BINARY_NAME }}.exe"
          Compress-Archive -Path "dist/$packageDir" -DestinationPath "dist/${{ env.BINARY_NAME }}-${{ matrix.name }}.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.name }}
          path: dist/${{ env.BINARY_NAME }}-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; > "SHA256SUMS-${{ github.ref_name }}.txt"

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS-${{ github.ref_name }}.txt
          generate_release_notes: true
