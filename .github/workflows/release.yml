name: Release
# The promoted image reports the Cargo.toml version. CI never passes the Dockerfile's
# HARUKI_PACKAGE_VERSION build arg (kept for manual builds; it no longer regenerates Cargo.lock).

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1

  binaries:
    name: Binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/rust-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      cargo-args: -p haruki-sekai-asset-updater
      # Release archives are built WITHOUT media-ffi (the image has it). Keep this
      # explicit in the release notes, or add a media-ffi Linux target here.
      asset-name: "{name}-{label}"

  docker:
    name: Docker
    needs: gate
    if: needs.gate.outputs.is-tag == 'true' # dry runs never push images
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      promote-on-tag: true # requires the version to live in Cargo.toml (no HARUKI_PACKAGE_VERSION rewrite)
      cache-backend: registry

  publish:
    name: GitHub Release
    needs: [gate, binaries, docker]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}
