name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UNITY_RS_TOKEN: ${{ secrets.UNITY_RS_TOKEN }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Authenticate the unity-rs dependency fetch
        if: env.UNITY_RS_TOKEN != ''
        shell: bash
        run: |
          # The asset engine is a Cargo git dependency. While that repository is
          # private, cargo needs a credential to fetch it. Runners are ephemeral
          # and Actions masks the secret in logs. With no secret configured this
          # step is skipped and an anonymous fetch is used, which is all a public
          # repository needs.
          git config --global \
            url."https://x-access-token:${UNITY_RS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Verify the unity-rs dependency is reachable
        shell: bash
        run: |
          if git ls-remote https://github.com/Team-Haruki/unity-rs.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          cat >&2 <<'EOF'
          Cannot reach Team-Haruki/unity-rs, the asset engine this project
          compiles in, so every cargo step below would fail while resolving it.

          This repository is public; unity-rs is not. GitHub does not pass
          secrets to pull requests from forks, so UNITY_RS_TOKEN is empty on
          those runs and there is no credential to authenticate with.

          Resolve it by making unity-rs public, after which no credential is
          needed anywhere and this check passes for everyone. Failing that,
          CI can only run on branches pushed to this repository, with
          UNITY_RS_TOKEN set as a repository secret.
          EOF
          exit 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check --locked --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace
