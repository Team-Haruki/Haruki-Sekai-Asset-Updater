name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UNITY_RS_TOKEN: ${{ secrets.UNITY_RS_TOKEN }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Authenticate the unity-rs dependency fetch
        if: env.UNITY_RS_TOKEN != ''
        shell: bash
        run: |
          # The asset engine is a Cargo git dependency. While that repository is
          # private, cargo needs a credential to fetch it. Runners are ephemeral
          # and Actions masks the secret in logs. With no secret configured this
          # step is skipped and an anonymous fetch is used, which is all a public
          # repository needs.
          git config --global \
            url."https://x-access-token:${UNITY_RS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check --locked --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace
