name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.0

      - name: Install Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: python -m pip install --disable-pip-version-check diff-cover==10.5.1

      - name: Generate LCOV and enforce overall coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info --fail-under-lines 90

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Enforce coverage on changed code
        if: github.event_name == 'pull_request'
        run: diff-cover lcov.info --compare-branch=origin/main --fail-under=90 --show-uncovered
