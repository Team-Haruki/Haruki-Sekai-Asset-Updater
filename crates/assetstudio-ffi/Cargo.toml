[package]
name = "haruki-assetstudio-ffi"
version = "6.0.5"
edition = "2021"
description = "AssetStudio FFI worker and typed ABI support for Haruki Sekai Asset Updater"
license = "MIT"

[dependencies]
# The engine, linked in rather than dlopened. Pinned by revision so a rebuild of
# a given Haruki tag resolves to the same source, which the previous
# build-time `git clone` of a branch head could not promise.
assetstudio-ffi = { git = "https://github.com/Team-Haruki/unity-rs.git", rev = "81b02a5" }
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
sonic-rs = "0.5"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-util", "process", "sync"] }
tracing = "0.1"
