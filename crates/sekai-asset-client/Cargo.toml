[package]
name = "sekai-asset-client"
version = "0.1.0"
edition = "2021"
description = "Provider-aware HTTP client for Project Sekai asset manifests and bundles"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "rustls"] }
sekai-asset-pipeline = { path = "../sekai-asset-pipeline" }
thiserror = "2.0"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
aes = "0.9"
axum = "0.8"
cbc = { version = "0.2", features = ["alloc"] }
futures-util = "0.3"
hex = "0.4"
rmp-serde = "1.3"
tempfile = "3.27"
