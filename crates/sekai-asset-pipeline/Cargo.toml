[package]
name = "sekai-asset-pipeline"
version = "0.1.0"
edition = "2021"
description = "Reusable single-bundle primitives for Sekai asset pipelines"
license = "MIT"
publish = false

[dependencies]
aes = "0.9"
ahash = { version = "0.8", default-features = false, features = ["std"] }
bytes = "1"
cbc = { version = "0.2", features = ["alloc"] }
cridecoder = "0.3.5"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
libc = "0.2"
rmp-serde = "1.3"
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg7_1", "link_system_ffmpeg"], optional = true }
serde = { version = "1.0", features = ["derive"] }
sonic-rs = "0.5"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
unity-rs-core = "0.5.1"

[features]
default = []
media-ffi = ["dep:rsmpeg"]
